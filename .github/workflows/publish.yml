name: Build CV and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tectonic
        run: |
          curl --fail --location --retry 3 https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz --output /tmp/tectonic.tar.gz
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo install /tmp/tectonic /usr/local/bin/tectonic
      - name: Compile CV
        run: tectonic --keep-logs Rahul_Golder_CV.tex
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp Rahul_Golder_CV.pdf _site/Rahul_Golder_CV.pdf
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
